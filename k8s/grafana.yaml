# Grafana's address on the tailnet: https://grafana.<tailnet>.ts.net, with a
# certificate from Tailscale, through the Tailscale operator Plutus already
# runs. Nothing is exposed on neptune's own interfaces.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-grafana
      port:
        number: 80
  tls:
    - hosts:
        - grafana
---
# Grafana trusts the Tailscale-User-Login header for sign-in, so only the
# Tailscale proxies (in the tailscale namespace) may reach it. Any other pod
# could otherwise send the header and sign in as anyone. Only Grafana's pod
# is selected; the rest of the stack is left open for now.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 3000
