# Prometheus, Grafana, node-exporter, kube-state-metrics and the Prometheus
# operator, from the community kube-prometheus-stack chart. Dashboards only
# for now: Alertmanager is off (docs/adr/0001).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: monitoring
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # The operator's CRDs are large and the first install pulls several images.
  timeout: 15m
  values:
    # Dashboards only at first; no one to page yet.
    alertmanager:
      enabled: false

    # k3s runs the controller manager, scheduler and proxy inside its own
    # binary, bound to localhost, and keeps state in SQLite (kine), not etcd.
    # There is nothing to scrape, and leaving them on means targets that are
    # always down and rules that always fire.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus:
      prometheusSpec:
        scrapeInterval: 30s
        retention: 30d
        # Prometheus deletes the oldest blocks past this size, before the
        # volume could fill; local-path does not enforce the claim's size.
        retentionSize: 40GB
        # Pick up every ServiceMonitor, PodMonitor, rule and probe in the
        # cluster, not only those carrying this release's label, so each app
        # declares its own scrape targets in its own repository.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    grafana:
      defaultDashboardsTimezone: browser
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # Keeps the signed-up user and anything edited in the UI across
      # restarts. Dashboards meant to last go in Git as ConfigMaps labelled
      # grafana_dashboard: "1" (the sidecar reads every namespace).
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        size: 2Gi
      # local-path creates its directories world-writable, so the root
      # init container that chowns them is not needed.
      initChownData:
        enabled: false
      grafana.ini:
        server:
          root_url: https://grafana.tail0adfbf.ts.net
        analytics:
          check_for_updates: false
          reporting_enabled: false
        # Sign-in is the tailnet identity (docs/adr/0001). The Tailscale
        # proxy in front of the Ingress sets Tailscale-User-Login on each
        # request from a person's device; Grafana trusts it and creates the
        # user on first visit. Only that proxy may reach the pod
        # (grafana-network.yaml), so nothing else can forge the header.
        # Without the header (e.g. from a tagged device) Grafana falls back
        # to its login form and the chart's generated admin password.
        auth.proxy:
          enabled: true
          header_name: Tailscale-User-Login
          header_property: username
          auto_sign_up: true
          headers: "Name:Tailscale-User-Name"
        users:
          auto_assign_org_role: Admin
